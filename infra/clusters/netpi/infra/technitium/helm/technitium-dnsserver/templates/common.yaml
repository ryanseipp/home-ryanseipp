apiVersion: v1
kind: Service
metadata:
  name: technitium-technitium-dnsserver
  labels:
    app.kubernetes.io/instance: technitium
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: technitium-dnsserver
    app.kubernetes.io/version: 14.3.0
    helm.sh/chart: technitium-dnsserver-1.8.0
  annotations:
    io.cilium/lb-ipam-ips: 10.0.20.53
spec:
