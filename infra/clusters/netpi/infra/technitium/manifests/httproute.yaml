# yaml-language-server: $schema=https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/main/config/crd/experimental/gateway.networking.k8s.io_httproutes.yaml
#
# HTTPRoute for Technitium DNS Web UI
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: technitium-webui
  namespace: dns
  labels:
    app.kubernetes.io/name: technitium
    app.kubernetes.io/component: httproute
spec:
  parentRefs:
    - name: technitium-webui
      namespace: dns
  hostnames:
    - dns.seipp.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: technitium
          port: 5380
