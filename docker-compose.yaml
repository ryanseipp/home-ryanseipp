services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "identity"]
      interval: 2s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-broker-api-versions.sh",
          "--bootstrap-server",
          "localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 5

  grafana:
    image: grafana/otel-lgtm:0.11.1
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - grafana:/data

  scylla:
    image: scylladb/scylla:2026.1.0
    ports:
      - "9042:9042"
    command: --smp 1 --memory 512M --overprovisioned 1
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACES"]
      interval: 5s
      timeout: 5s
      retries: 10

  spire-server:
    image: ghcr.io/spiffe/spire-server:1.12.0
    command: ["-config", "/opt/spire/conf/server.conf"]
    ports:
      - "8081:8081"
    volumes:
      - ./spire/server.conf:/opt/spire/conf/server.conf:ro
      - spire-data:/opt/spire/data
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.12.0
    command: ["-config", "/opt/spire/conf/agent.conf"]
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - ./spire/agent.conf:/opt/spire/conf/agent.conf:ro
      - spire-socket:/tmp/spire-agent/public
    pid: "host"
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  kafka-data:
  grafana:
  scylla-data:
  spire-data:
  spire-socket:
