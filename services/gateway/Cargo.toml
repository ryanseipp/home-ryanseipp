[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[features]
db-tests = []

[lints]
workspace = true

[dependencies]
# HTTP framework
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# gRPC client for calling backend services
tonic = { workspace = true, features = ["transport", "channel"] }
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true

# TLS
aws-lc-rs.workspace = true
rustls = { workspace = true, features = ["aws_lc_rs"] }
tokio-rustls.workspace = true
rustls-pemfile.workspace = true

# Async runtime
tokio.workspace = true

# HTTP primitives (for TLS serve loop)
hyper.workspace = true
hyper-util.workspace = true

# SPIFFE / mTLS
spiffe.workspace = true
spiffe-rustls.workspace = true
tonic-tls.workspace = true

# Configuration
config.workspace = true
serde.workspace = true
serde_json.workspace = true

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
json-subscriber.workspace = true

# Error handling
thiserror.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
identity = { path = "../identity" }
rcgen.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { workspace = true, features = ["aws_lc_rs"] }
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
temp-env = "0.3"
tempfile = "3"
testcontainers.workspace = true
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio-rustls.workspace = true
uuid.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
