[package]
name = "identity"
version = "0.1.0"
edition = "2024"

[features]
default = []
fips = ["aws-lc-rs/fips", "rustls/fips"]

[dependencies]
async-trait.workspace = true
aws-lc-rs.workspace = true
base64ct.workspace = true
config.workspace = true
json-subscriber.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
prost.workspace = true
prost-types.workspace = true
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic = { workspace = true, features = ["transport", "tls-aws-lc"] }
tonic-prost.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }
proptest = "1"
rcgen.workspace = true
tempfile = "3"
tonic = { workspace = true, features = ["transport", "tls-aws-lc", "channel"] }

[build-dependencies]
tonic-prost-build.workspace = true
